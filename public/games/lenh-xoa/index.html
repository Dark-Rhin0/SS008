<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lệnh Xóa</title><link rel="icon" href="index.icon.png"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e12;color:#e8e5dc;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse,#243e46,#080e12 75%);padding:28px;text-align:center;box-sizing:border-box}#loading[hidden]{display:none}h1{font-size:clamp(36px,7vw,72px);letter-spacing:.09em;color:#e4c99c;margin:0 0 25px}p{max-width:540px;line-height:1.7;color:#b8cdce}progress{width:min(420px,80vw);height:8px;accent-color:#dcbd88;border:0;border-radius:5px}#retry{padding:12px 22px;background:#e4c99c;border:0;border-radius:6px;font-size:16px;cursor:pointer}#details{font-size:13px;max-width:620px;overflow-wrap:anywhere}a{color:#d8c095}#return{margin-top:25px;font-size:14px}
</style></head><body><canvas id="canvas" tabindex="0" aria-label="Game Lệnh Xóa">Trình duyệt cần hỗ trợ WebGL 2 để chạy game.</canvas><div id="loading"><h1>LỆNH XÓA</h1><progress id="progress" max="1" value="0"></progress><p id="status" role="status">Chuẩn bị tải game…</p><p id="details">Lần tải đầu có thể mất một lúc. Nhấn vào game để bật âm thanh và điều khiển.</p><button id="retry" hidden>Tải lại</button><a id="return" href="/game" target="_top">Quay lại kho trò chơi</a></div><script src="index.js"></script><script src="loader.js"></script></body></html>
